[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "artifact-sftp-mcp"
version = "0.19.0"
description = "MCP-only local stdio adapter for the Artifact SFTP plugin"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NGS" }]
dependencies = [
  "mcp[cli]==2.0.0",
]

[project.scripts]
artifact-sftp-mcp = "artifact_sftp_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artifact_sftp_mcp"]
